name = "spc-telegram-miniapp"
main = "src/worker.js"
compatibility_date = "2026-11-04"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "spc-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
APP_NAME = "SPIDER COIN"
